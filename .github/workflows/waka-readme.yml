name: Waka Readme

on:
  schedule:
    - cron: "0 0 * * *"   # daily at midnight UTC
  workflow_dispatch:

jobs:
  update-readme:
    name: Update README with WakaTime stats
    runs-on: ubuntu-latest
    steps:
      - name: Skip update when WakaTime API key is not configured
        if: ${{ secrets.WAKATIME_API_KEY == '' }}
        run: echo "WAKATIME_API_KEY is not configured; skipping WakaTime README update."

      - name: Update README with WakaTime stats
        if: ${{ secrets.WAKATIME_API_KEY != '' }}
        uses: athul/waka-readme@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          SHOW_TITLE: true
          TIME_RANGE: last_7_days
          SHOW_TIME: true
          SHOW_TOTAL: true
          LANG_COUNT: 8
