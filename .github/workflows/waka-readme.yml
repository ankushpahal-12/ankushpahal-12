name: Waka Readme

on:
  schedule:
    - cron: "0 0 * * *"   # daily at midnight UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    name: Update README with WakaTime stats
    runs-on: ubuntu-latest
    steps:
      - name: Update WakaTime section
        if: ${{ secrets.WAKATIME_API_KEY != '' }}
        uses: athul/waka-readme@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHOW_TITLE: true
          TIME_RANGE: today
          SHOW_TIME: true
          SHOW_TOTAL: true
          LANG_COUNT: 8

      - name: Skip when WakaTime API key is missing
        if: ${{ secrets.WAKATIME_API_KEY == '' }}
        run: echo "Skipping WakaTime update because WAKATIME_API_KEY is not configured."
